<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фондация Китка Здравец | Kitka Zdravets Foundation</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="fine digital test">
    <meta property="og:image" content="https://kitkazdravets.eu/favicon-256.png">
    <meta property="og:image:type" content="image/jpeg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://kitkazdravets.eu/favicon-256.png">
    <style>
        body {
            margin: 0;
        }

        main {
            margin: 0;
        }

        .left-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: calc(50vw - 250px);
            height: 100vh;
            animation: randomColorLeft 9s infinite alternate step-end;
        }

        .right-bg {
            position: fixed;
            top: 0;
            right: 0;
            width: calc(50vw - 250px);
            height: 100vh;
            animation: randomColorRight 6s infinite alternate step-end;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100vw;
            max-height: 100vh;
        }

        .center-image {
            position: relative;
            max-width: 100vh;
            max-height: 100vh;
            object-fit: cover;
            display: block;
        }

        .gif-overlay {
            position: absolute;
            bottom: 0;
            right: 0px;
            width: 30px;
            height: auto;
            pointer-events: none;
        }

        .youtube-link {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            transition: transform 0.2s ease, background-color 0.2s ease;
            z-index: 10;
        }

        .youtube-link:hover {
            background-color: #ff0000;
            transform: scale(1.1);
        }

        .youtube-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        @keyframes randomColorLeft {
            0% {
                background-color: #1a0933;
            }

            15% {
                background-color: #0d2b22;
            }

            33% {
                background-color: #3b1c1c;
            }

            48% {
                background-color: #112233;
            }

            67% {
                background-color: #2e2608;
            }

            82% {
                background-color: #1f0a1d;
            }

            100% {
                background-color: #08262c;
            }
        }

        @keyframes randomColorRight {
            0% {
                background-color: #2b1a08;
            }

            20% {
                background-color: #0f1d3a;
            }

            38% {
                background-color: #2a082e;
            }

            55% {
                background-color: #082d18;
            }

            73% {
                background-color: #380e14;
            }

            90% {
                background-color: #17282b;
            }

            100% {
                background-color: #242409;
            }
        }

        @media (max-width: 768px) {

            .image-wrapper,
            .center-image {
                width: 100vw;
                height: 100vw;
                max-width: none;
                max-height: none;
            }

            .left-bg {
                width: 100vw;
                height: calc(50vh - (85vw / 2));
                top: 0;
                left: 0;
            }

            .right-bg {
                width: 100vw;
                height: calc(50vh - (85vw / 2));
                bottom: 0;
                left: 0;
                top: auto;
                right: auto;
            }

            .gif-overlay {
                width: 20px;
                bottom: 0;
                right: 0;
            }

            .youtube-link {
                width: 32px;
                height: 32px;
                bottom: 8px;
                left: 8px;
            }

            .youtube-icon {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="left-bg"></div>
    <div class="right-bg"></div>

    <main style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="image-wrapper">
            <img src="img/kitkazdravetseu.jpg" alt="Китка Здравец | Kitka Zdravets" class="center-image">
            <img src="img/13.gif" alt="Кукерче Слънцето Сиси | Kukerche Sisi The Sun" class="gif-overlay">

            <a href="https://www.youtube.com/@kitkazdravets" target="_blank" rel="noopener noreferrer" class="youtube-link" title="YouTube канал">
                <svg class="youtube-icon" viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
            </a>
        </div>
    </main>

</body>

</html>
